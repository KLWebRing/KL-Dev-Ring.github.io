<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b0c">
  <meta name="description" content="KL Dev-Ring is Kerala's open-source builder network. Ranked by what you ship. Connected by what you build.">
  <title>KL Dev-Ring — Kerala's Builder Network</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <!-- Boot intro screen -->
  <div class="boot" id="boot" role="dialog" aria-label="Initializing KL Dev-Ring">
    <button class="boot-skip" id="skipBoot">Skip intro ↗</button>
    <div class="boot-radar" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="boot-copy">
      <span class="eyebrow">KL / NETWORK BOOT</span>
      <h1 id="bootLine">Initializing Kerala Builder Network...</h1>
      <div class="boot-track"><span id="bootProgress"></span></div>
      <div class="boot-metrics" id="bootMetrics"></div>
    </div>
  </div>

  <header class="topbar">
    <a class="brand" href="./" aria-label="KL Dev-Ring home">
      <svg viewBox="0 0 46 46" aria-hidden="true">
        <path d="M23 2 42 12v22L23 44 4 34V12Z"/>
        <path d="m12 27 7-11v14m0-7 9-7m-9 7 9 7m-1-14h7m-7 14h7"/>
      </svg>
      <span><b>KL</b> DEV-RING</span>
    </a>
    <div class="topbar-stats" id="topbarStats">
      <!-- Live telemetry stats rendered by JS -->
    </div>
    <a class="join-button" href="https://github.com/KLWebRing/KL-Dev-Ring.github.io#join" target="_blank" rel="noreferrer">
      <span>Join the ring</span><i>↗</i>
    </a>
  </header>

  <main class="dashboard-wrap">
    <!-- 3D Town Viewport -->
    <div id="worldContainer" style="width: 100%; height: 100%; position: relative; overflow: hidden;">
      <div id="interactionPrompt" class="interaction-prompt">Press E to interact</div>
      
      <!-- Minimal HUD overlays -->
      <div class="hud-controls-hint">
        <span><b>WASD / ARROWS</b> Walk</span>
        <span><b>SHIFT</b> Run</span>
        <span><b>SPACE</b> Jump</span>
        <span><b>1, 2</b> Emotes</span>
        <span><b>E</b> Interact</span>
        <span><b>MOUSE DRAG</b> Orbit Camera</span>
      </div>

      <div id="screenOverlay" class="screen-overlay"></div>
    </div>
  </main>

  <!-- IMMERSIVE GAME DIALOGS -->
  
  <!-- Community Notice Board (Chat) -->
  <dialog class="game-modal" id="chatOverlay">
    <button class="modal-close" id="closeChatOverlay" aria-label="Close board">×</button>
    <div class="modal-terminal-header">
      <span class="live-dot"></span> COMMUNITY CORRIDOR / NOTICE BOARD
    </div>
    <div class="chat-container">
      <div class="chat-messages" id="chatMessages">
        <!-- Posts render dynamically -->
      </div>
      <form class="chat-input-bar" id="chatForm">
        <input type="text" id="chatInput" placeholder="Pin a notice to the board..." autocomplete="off" maxlength="500">
        <button type="submit" id="chatSendBtn">PIN POST <span>↗</span></button>
      </form>
    </div>
  </dialog>

  <!-- Town Hall Scoreboard (Leaderboard) -->
  <dialog class="game-modal" id="leaderboardOverlay">
    <button class="modal-close" id="closeLeaderboardOverlay" aria-label="Close plaque">×</button>
    <div class="modal-terminal-header">
      🏆 TOWN HALL SCOREBOARD / DIRECTORY
    </div>
    <div class="leaderboard-pane-inner">
      <div class="leaderboard-header">
        <div class="search-wrap">
          <span>⌕</span>
          <input id="search" type="search" placeholder="Filter rankings by name, district, or craft..." autocomplete="off">
        </div>
        <div class="leaderboard-tabs" role="tablist" aria-label="Ranking Categories">
          <button class="tab-btn active" data-tab="all-time" role="tab" aria-selected="true">All-Time</button>
          <button class="tab-btn" data-tab="monthly" role="tab" aria-selected="false">Monthly</button>
          <button class="tab-btn" data-tab="weekly" role="tab" aria-selected="false">Weekly</button>
          <button class="tab-btn" data-tab="daily" role="tab" aria-selected="false">Daily</button>
          <button class="tab-btn" data-tab="districts" role="tab" aria-selected="false">Districts</button>
          <button class="tab-btn" data-tab="colleges" role="tab" aria-selected="false">Colleges</button>
        </div>
      </div>
      
      <div class="leaderboard-body">
        <table class="sidebar-table">
          <thead>
            <tr id="leaderboardHeaderRow">
              <th>RANK</th>
              <th>BUILDER</th>
              <th class="num-col">SCORE</th>
              <th class="num-col">STREAK</th>
            </tr>
          </thead>
          <tbody id="leaderboardRows">
            <!-- Rendered dynamically -->
          </tbody>
        </table>
      </div>
    </div>
  </dialog>

  <!-- Builder Passport Modal -->
  <dialog class="profile-modal" id="profileModal">
    <button class="modal-close" id="closeProfile" aria-label="Close passport">×</button>
    <div id="profileContent"></div>
  </dialog>

  <script type="module" src="./app.js"></script>
</body>
</html>
